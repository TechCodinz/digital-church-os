name: Production Verification

on:
  pull_request:
    branches:
      - main
      - production/ultra-route-hardening
  push:
    branches:
      - main
      - production/ultra-route-hardening
      - phase11-ministry-experience-enhancements
  workflow_dispatch:

# Temporary write permission is used only to persist the Prisma-generated
# historical baseline exactly once. Remove this after the baseline commit lands.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/digital_church_os_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/digital_church_os_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digital_church_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate historical Prisma core baseline if missing
        run: |
          set -euo pipefail
          BASELINE_SCHEMA=/tmp/prisma-core-baseline.prisma
          BASELINE_DIR=prisma/migrations/20260518000000_prisma_core_baseline
          if [ ! -s "$BASELINE_DIR/migration.sql" ]; then
            git show a2687acff0db94a8dd5cd6bdb8d39f2d9616b433:prisma/schema.prisma > "$BASELINE_SCHEMA"
            mkdir -p "$BASELINE_DIR"
            npx prisma migrate diff \
              --from-empty \
              --to-schema-datamodel "$BASELINE_SCHEMA" \
              --script > "$BASELINE_DIR/migration.sql"
          fi
          test -s "$BASELINE_DIR/migration.sql"
          echo "Baseline lines: $(wc -l < "$BASELINE_DIR/migration.sql")"
          sha256sum "$BASELINE_DIR/migration.sql"

      - name: Persist generated core baseline once
        if: github.event_name == 'pull_request' && github.head_ref == 'phase11-ministry-experience-enhancements'
        run: |
          set -euo pipefail
          git add prisma/migrations/20260518000000_prisma_core_baseline/migration.sql
          if git diff --cached --quiet; then
            echo "Historical core baseline is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(db): restore historical Prisma core baseline"
          git push origin HEAD:phase11-ministry-experience-enhancements

      - name: Apply migrations to fresh CI database
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
