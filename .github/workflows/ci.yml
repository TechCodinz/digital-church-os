name: Production Verification

on:
  pull_request:
    branches:
      - main
      - production/ultra-route-hardening
  push:
    branches:
      - main
      - production/ultra-route-hardening
      - phase11-ministry-experience-enhancements
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/digital_church_os_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/digital_church_os_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digital_church_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      # Diagnostic bridge for the repository's historical database gap. The
      # first committed raw-SQL migration (20260518235000) assumed the Prisma
      # core schema already existed. Generate that exact pre-migration schema
      # from the parent commit with Prisma itself, then exercise it as the
      # earliest migration on a blank PostgreSQL database. Once this artifact
      # is proven, the generated SQL is committed as a static baseline and this
      # diagnostic generation step is removed.
      - name: Generate historical Prisma core baseline
        run: |
          set -euo pipefail
          BASELINE_SCHEMA=/tmp/prisma-core-baseline.prisma
          BASELINE_DIR=prisma/migrations/20260518000000_prisma_core_baseline
          git show a2687acff0db94a8dd5cd6bdb8d39f2d9616b433:prisma/schema.prisma > "$BASELINE_SCHEMA"
          mkdir -p "$BASELINE_DIR"
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel "$BASELINE_SCHEMA" \
            --script > "$BASELINE_DIR/migration.sql"
          test -s "$BASELINE_DIR/migration.sql"
          echo "Generated baseline lines: $(wc -l < "$BASELINE_DIR/migration.sql")"
          sha256sum "$BASELINE_DIR/migration.sql"

      - name: Upload generated core baseline
        uses: actions/upload-artifact@v4
        with:
          name: prisma-core-baseline
          path: prisma/migrations/20260518000000_prisma_core_baseline/migration.sql
          if-no-files-found: error
          retention-days: 1

      - name: Apply migrations to fresh CI database
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
